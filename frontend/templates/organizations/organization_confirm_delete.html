<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supprimer l'organisation</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            max-width: 440px;
            width: 100%;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .icon-box {
            width: 48px;
            height: 48px;
            background-color: #fef2f2;
            color: #ef4444;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.25rem auto;
            font-weight: bold;
            font-size: 1.25rem;
        }

        h2 {
            font-size: 1.25rem;
            color: #0f172a;
            margin-bottom: 0.5rem;
        }

        p {
            font-size: 0.875rem;
            color: #64748b;
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }

        .button-group {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
        }

        .btn {
            padding: 0.625rem 1.25rem;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            border: none;
            flex: 1;
        }

        .btn-cancel {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            color: #334155;
        }

        .btn-cancel:hover {
            background-color: #f8fafc;
        }

        .btn-danger {
            background-color: #dc2626;
            color: #ffffff;
        }

        .btn-danger:hover {
            background-color: #b91c1c;
        }
    </style>
</head>
<body>

    <div class="modal-card">
        <div class="icon-box">!</div>
        <h2>Supprimer "{{ object.name }}" ?</h2>
        <p>
            Êtes-vous sûr de vouloir supprimer cette organisation ? Cette action est <strong>définitive</strong> et supprimera l'ensemble de ses données.
        </p>

        <form method="post">
            {% csrf_token %}
            <div class="button-group">
                <a href="{% url 'organization_list' %}" class="btn btn-cancel">Annuler</a>
                <button type="submit" class="btn btn-danger">Oui, supprimer</button>
            </div>
        </form>
    </div>

</body>
</html>
